<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t">
  <title id="t">Mithridates: a drop of poison falling into a Greek eye-cup with one red and one green eye</title>
  <!-- The dose: one drop of poison. -->
  <path d="M60 8 C60 8 50 22.5 50 30.5 a10 10 0 0 0 20 0 C70 22.5 60 8 60 8 Z" fill="#e5534b"/>
  <!-- The eye-cup (kylix): rim, bowl, two handles, stem, foot. -->
  <g fill="none" stroke="#8b949e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 54 H103"/>
    <path d="M20 54 C23 78 41 89 60 89 C79 89 97 78 100 54"/>
    <path d="M20 57 C9 57 4 50 8 45 C11 41.5 17 44 19 49.5"/>
    <path d="M100 57 C111 57 116 50 112 45 C109 41.5 103 44 101 49.5"/>
    <path d="M60 89 V100"/>
    <path d="M45 106 C50 100 70 100 75 106 Z"/>
  </g>
  <!-- The eyes Greek potters painted on cups to ward off harm: one for each route. -->
  <g fill="none" stroke="#8b949e" stroke-width="2.6" stroke-linejoin="round">
    <path d="M30 68 Q42.5 57.5 55 68 Q42.5 78.5 30 68 Z"/>
    <path d="M65 68 Q77.5 57.5 90 68 Q77.5 78.5 65 68 Z"/>
  </g>
  <circle cx="42.5" cy="68" r="5" fill="#e5534b"/>
  <circle cx="77.5" cy="68" r="5" fill="#3fb950"/>
</svg>
