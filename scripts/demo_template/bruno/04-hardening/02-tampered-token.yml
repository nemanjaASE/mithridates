info:
  name: Tampered token
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:__PORT__/api/v1/users/me
  auth:
    type: bearer
    token: "{{token}}x"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs: |-
  # 04.2 — A token with a broken signature

  One extra character breaks the signature: `401`.
