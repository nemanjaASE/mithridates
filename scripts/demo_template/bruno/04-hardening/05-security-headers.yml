info:
  name: Security headers
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:__PORT__/
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: "nosniff"
    - expression: res.headers['x-frame-options']
      operator: eq
      value: "DENY"

docs: |-
  # 04.5 — The response headers

  `nosniff`, `DENY`, a strict Content-Security-Policy, and no `Server` header.
