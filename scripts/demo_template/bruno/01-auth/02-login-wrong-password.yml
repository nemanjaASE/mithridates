info:
  name: Wrong password is rejected
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:__PORT__/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "ana",
        "password": "wrong"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs: |-
  # 01.2 — A wrong password

  `401`, with the same message an unknown username gets.
