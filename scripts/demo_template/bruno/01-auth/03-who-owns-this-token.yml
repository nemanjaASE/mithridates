info:
  name: Who owns this token
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:__PORT__/api/v1/users/me
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.username
      operator: eq
      value: "ana"

docs: |-
  # 01.3 — The token's owner

  Returns the user the token was issued for.
