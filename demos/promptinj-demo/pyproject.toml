[project]
name = "promptinj-demo"
version = "0.2.0"
description = "Controlled lab: an LLM prompt injection attack and its mitigations (FastAPI + LangGraph + local Ollama)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.160,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.3",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "langchain>=1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
]

[tool.ruff]
# One settings block, identical in both services: style is checkable, not a matter of taste.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F  pyflakes + pycodestyle   I  import order        N  naming
# UP   modern syntax            B  likely bugs         C4 comprehensions
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = [
    # The formatter's business; a long explanatory comment is not worth a broken line.
    "E501",
    # `StoreUnavailable`, `UnknownAssistant`: the error names read as the condition they
    # describe, and the base class already says they are errors. A deliberate convention,
    # the same in both services.
    "N818",
    # `class Variant(str, Enum)` is kept over `StrEnum`: it is what FastAPI path params
    # and Pydantic have always accepted, and it is the shape both services use.
    "UP042",
    # `Depends(...)` in a default argument is how FastAPI declares a dependency.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Diagram code is geometry: `W`, `H`, `NX` are the clearest names a coordinate can have,
# and a `dict()` call reads better than a literal in a long keyword chain.
"docs/diagrams.py" = ["N", "E741", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["promptinj"]

[tool.mypy]
python_version = "3.14"
# src layout: the package is not installed, it is imported from src/.
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# The ports are Protocols, so a missing method is a type error instead of an
# AttributeError at runtime. Strictness is kept to what the lab can satisfy today.
disallow_untyped_defs = false
ignore_missing_imports = true
