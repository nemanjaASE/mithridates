info:
  name: Login with unknown email
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8002/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "nobody@akme.rs",
        "password": "Ana#2024!"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs: |-
  # 01.3 — Unknown email

  Also `401`, and the same body as 01.2 — an attacker cannot tell which addresses exist.

  The timing matches too: when the email is unknown the use case still verifies the
  password against a dummy bcrypt hash, so there is no account enumeration through
  response time either.
