info:
  name: Question over the length limit
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8002/api/v1/assistant/vulnerable
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "question": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

docs: |-
  # 04.4 - 2001 characters

  `422` from `max_length=2000`. An unbounded prompt is unbounded token spend on a model
  that charges by the token or, here, pins a CPU (OWASP LLM10: Unbounded Consumption).

  The response must not contain a wall of `a`s - the input is not echoed back.
