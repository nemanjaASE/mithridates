docs: |-
  # 00.1 — Is the stack the real one?

  Run this first. `backend` must show the models by role, the persistence backend and the
  retrieval wiring:

  ```json
  {
    "models": { "cheap": "ollama:qwen2.5:3b", "strong": "ollama:qwen2.5:3b" },
    "store": "sqlalchemy",
    "retrieval": "sqlalchemy:ollama:nomic-embed-text"
  }
  ```

  A `test-double` anywhere here means the process was started by the test suite, not by
  `docker compose` — stop and fix that before running anything below, or every result is
  measuring the wrong system.

  `assistants` lists one row per registered assistant, so anything added since shows up
  without reading the source.
