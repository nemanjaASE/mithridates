# Alembic, for developer use from the project root:
#   uv run alembic revision --autogenerate -m "what changed"
#   uv run alembic upgrade head
#
# Needs the ADMIN connection in the environment (DB_HOST, DB_NAME, DB_ADMIN_USER,
# DB_ADMIN_PASSWORD); env.py builds the URL from SeedSettings, so it is never written
# here. The application's lab_app role has no DDL rights at all.
#
# The seed container does not use this file — it calls upgrade_to_head() directly.

[alembic]
script_location = src/promptinj/infrastructure/db/sqlalchemy/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
