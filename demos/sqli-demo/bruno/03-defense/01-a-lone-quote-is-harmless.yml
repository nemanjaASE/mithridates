info:
  name: A lone quote is harmless data
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8001/api/v1/safe/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "'",
        "password": "anything"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs: |-
  # 03.1 — A lone quote proves which route you are on

  On the safe route a single quote is a one-character username: `401`.

  02.1 sends the same body to `/api/v1/vulnerable/auth/login` and gets `400` with
  `"The request could not be processed."` — the concatenated SQL no longer parses.

  That `400` is how an attacker finds an injection point, which is why the message is
  generic and says nothing about SQL: the response must not confirm the guess. The
  database's own error text goes only to the server log, under the `error_id` in the body.
