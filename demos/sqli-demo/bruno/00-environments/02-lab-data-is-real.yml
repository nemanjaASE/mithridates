info:
  name: Lab data is real
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8001/api/v1/debug/users
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: |-
  # 00.2 — What is actually in the database

  Four users and the names of three secrets. This exists so the attack below can be judged
  against real rows rather than against a plausible-looking response.

  Note what is NOT here: `secret_names` lists the names, never the values. The value of
  `flag` is what request 02.3 exfiltrates — through the token, not through this endpoint.
