info:
  name: Wrong password
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8001/api/v1/safe/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "not-the-password"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.error
      operator: eq
      value: "Invalid username or password."

docs: |-
  # 01.2 — A rejected login

  `401` with `WWW-Authenticate: Bearer`, and one generic message.

  Compare the body with 01.3 character by character: an existing user with a wrong
  password and a user who does not exist get the **same** answer, so the endpoint cannot
  be used to enumerate accounts.
