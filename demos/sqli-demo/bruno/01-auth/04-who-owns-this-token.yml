info:
  name: Who owns this token
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8001/api/v1/users/me
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.username
      operator: eq
      value: "admin"

docs: |-
  # 01.4 — The token's owner

  **This is the instrument the whole attack is measured with.** It returns the subject of
  the verified token, so after each login below it answers one question: *who did the
  application just become?*

  Right now it is `admin`, because 01.1 logged in with the admin password. In folder 02
  the same endpoint will say `admin` again — without any password having been sent.
