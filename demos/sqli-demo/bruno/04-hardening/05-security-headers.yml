info:
  name: Security headers
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8001/
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: "nosniff"
    - expression: res.headers['x-frame-options']
      operator: eq
      value: "DENY"

docs: |-
  # 04.5 — The response headers

  Check the headers tab: `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`,
  `Referrer-Policy: no-referrer`, `Cache-Control: no-store`, the two `Cross-Origin-*`
  headers, and `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'` for a
  JSON API that is not supposed to load anything.

  There is no `Server` header: uvicorn runs with `--no-server-header`, so the response does
  not announce its own version.

  `/docs` is the one path that does not get the strict CSP — Swagger UI loads its scripts
  from a CDN and a `default-src 'none'` policy would break it. That exception is in
  `app/api/middleware/security_headers.py`, where it can be read in one line.
