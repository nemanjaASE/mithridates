info:
  name: Wrong HTTP method
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8001/api/v1/safe/auth/login
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"

docs: |-
  # 04.3 — Login is a POST

  `405 Method Not Allowed`, from the router — credentials never belong in a URL, where
  they would end up in access logs, browser history and `Referer` headers.
