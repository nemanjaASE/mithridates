<title id="t">Parameterized query: statement and values separated</title><desc id="d">The statement has two placeholders and is parsed on its own; the username and password follow as values, so the payload is only ever compared, never parsed.</desc>
<defs><marker id="to" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#9DA6B7" stroke-width="1.1"/></marker><marker id="to-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#E0E6F0" stroke-width="1.1"/></marker><marker id="to-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#E08585" stroke-width="1.1"/></marker><marker id="to-safe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#9FEF00" stroke-width="1.1"/></marker></defs>
