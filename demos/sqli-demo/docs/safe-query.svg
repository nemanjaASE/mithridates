<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 828" width="1100" height="828" role="img" aria-labelledby="t d">
<title id="t">Safe: statement and values sent separately</title><desc id="d">The statement has two placeholders and is parsed on its own; the username and password follow as values, so the payload is only ever compared, never parsed.</desc>
<defs><marker id="to" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#161616" stroke-width="1.4"/></marker><marker id="to-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#161616" stroke-width="1.4"/></marker><marker id="to-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#A2191F" stroke-width="1.4"/></marker><marker id="to-safe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.2 L7.4,4 L0,6.8" fill="none" stroke="#0E6027" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="828" fill="#FFFFFF"/>
<text x="56" y="96" fill="#161616" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="700" xml:space="preserve" textLength="695.37" lengthAdjust="spacingAndGlyphs">Safe: statement and values sent separately</text>
<polyline points="56,132 1044,132" fill="none" stroke="#C6C6C6" stroke-width="1"/>
<text x="56" y="176" fill="#262626" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17.5" font-weight="700" xml:space="preserve" textLength="42.77" lengthAdjust="spacingAndGlyphs">Input</text>
<text x="56" y="208" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="121.0" lengthAdjust="spacingAndGlyphs">username = </text>
<text x="177.0" y="208" fill="#A2191F" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="88.0" lengthAdjust="spacingAndGlyphs">admin'--</text>
<text x="265.0" y="208" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="165.0" lengthAdjust="spacingAndGlyphs">    password = </text>
<text x="430.0" y="208" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="88.0" lengthAdjust="spacingAndGlyphs">anything</text>
<rect x="56" y="272" width="988" height="132" fill="#FFFFFF" stroke="#161616" stroke-width="2"/>
<text x="56" y="262" fill="#262626" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17.5" font-weight="700" xml:space="preserve" textLength="336.51" lengthAdjust="spacingAndGlyphs">The statement, as the database parses it</text>
<text x="80" y="312" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="356.4" lengthAdjust="spacingAndGlyphs">SELECT id, username, role FROM users</text>
<text x="80" y="346" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="168.3" lengthAdjust="spacingAndGlyphs">WHERE username = </text>
<text x="248.3" y="346" fill="#0E6027" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="19.8" lengthAdjust="spacingAndGlyphs">%s</text>
<text x="268.1" y="346" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="267.3" lengthAdjust="spacingAndGlyphs"> AND password_hash = crypt(</text>
<text x="535.4000000000001" y="346" fill="#0E6027" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="19.8" lengthAdjust="spacingAndGlyphs">%s</text>
<text x="555.2" y="346" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="158.4" lengthAdjust="spacingAndGlyphs">, password_hash)</text>
<polyline points="248.3,352 248.3,358 268.1,358 268.1,352" fill="none" stroke="#0E6027" stroke-width="1.5"/>
<text x="248.3" y="382" fill="#0E6027" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" xml:space="preserve" textLength="35.85" lengthAdjust="spacingAndGlyphs">slot 1</text>
<polyline points="535.4000000000001,352 535.4000000000001,358 555.2,358 555.2,352" fill="none" stroke="#0E6027" stroke-width="1.5"/>
<text x="535.4000000000001" y="382" fill="#0E6027" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" xml:space="preserve" textLength="35.85" lengthAdjust="spacingAndGlyphs">slot 2</text>
<rect x="56" y="456" width="988" height="96" fill="#FFFFFF" stroke="#161616" stroke-width="2"/>
<text x="56" y="446" fill="#262626" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17.5" font-weight="700" xml:space="preserve" textLength="286.91" lengthAdjust="spacingAndGlyphs">The values, transmitted separately</text>
<text x="80" y="496" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="89.1" lengthAdjust="spacingAndGlyphs">slot 1 = </text>
<text x="169.1" y="496" fill="#A2191F" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="79.2" lengthAdjust="spacingAndGlyphs">admin'--</text>
<text x="248.3" y="496" fill="#0E6027" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="376.2" lengthAdjust="spacingAndGlyphs">    bound as data, never parsed as SQL</text>
<text x="80" y="528" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="89.1" lengthAdjust="spacingAndGlyphs">slot 2 = </text>
<text x="169.1" y="528" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="79.2" lengthAdjust="spacingAndGlyphs">anything</text>
<text x="56" y="606" fill="#262626" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17.5" font-weight="700" xml:space="preserve" textLength="83.63" lengthAdjust="spacingAndGlyphs">The result</text>
<text x="56" y="638" fill="#262626" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="89.1" lengthAdjust="spacingAndGlyphs">returns  </text>
<text x="145.1" y="638" fill="#161616" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="138.6" lengthAdjust="spacingAndGlyphs">no user named </text>
<text x="283.7" y="638" fill="#A2191F" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="79.2" lengthAdjust="spacingAndGlyphs">admin'--</text>
<text x="56" y="668" fill="#0E6027" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="49.5" lengthAdjust="spacingAndGlyphs">→ 401</text>
