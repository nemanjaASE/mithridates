<text x="56" y="446" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" xml:space="preserve" textLength="261.8" lengthAdjust="spacingAndGlyphs">THE VALUES, TRANSMITTED SEPARATELY</text>
