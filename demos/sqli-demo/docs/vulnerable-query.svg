<text x="56" y="108" fill="#E0E6F0" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="32" font-weight="700" xml:space="preserve" textLength="580.8" lengthAdjust="spacingAndGlyphs">Parsing of the concatenated query</text>
<polyline points="56,132 1044,132" fill="none" stroke="#3F4552" stroke-width="1"/>
<text x="56" y="176" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" xml:space="preserve" textLength="38.5" lengthAdjust="spacingAndGlyphs">INPUT</text>
<text x="56" y="208" fill="#E0E6F0" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="121.0" lengthAdjust="spacingAndGlyphs">username = </text>
<text x="177.0" y="208" fill="#E08585" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="88.0" lengthAdjust="spacingAndGlyphs">admin'--</text>
<text x="265.0" y="208" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="165.0" lengthAdjust="spacingAndGlyphs">    password = </text>
<text x="430.0" y="208" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="20" font-weight="400" xml:space="preserve" textLength="88.0" lengthAdjust="spacingAndGlyphs">anything</text>
<rect x="56" y="272" width="988" height="132" rx="12" fill="#1B1F26" stroke="#1B1F26" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="262" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" xml:space="preserve" textLength="308.0" lengthAdjust="spacingAndGlyphs">THE STATEMENT, AS THE DATABASE PARSES IT</text>
<text x="80" y="312" fill="#AAB2C2" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="356.4" lengthAdjust="spacingAndGlyphs">SELECT id, username, role FROM users</text>
<text x="80" y="346" fill="#E0E6F0" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace" font-size="18" font-weight="400" xml:space="preserve" textLength="168.3" lengthAdjust="spacingAndGlyphs">WHERE username = </text>
