name: Something is wrong
description: A demo does not start, or the documentation does not match the code
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The vulnerabilities in this repository are deliberate — please do not report those.
        SECURITY.md explains the difference.
  - type: input
    id: demo
    attributes:
      label: Which demo
      placeholder: sqli-demo
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what came back. Logs help.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Docker and OS
      placeholder: Docker 27.3 on Windows 11
